topic_theme: "매일 밤, 마음의 방향을 찾는 질문 — 위로와 성찰의 카드뉴스"
audience: "20~40대, 하루를 잘 마무리하고 싶은 사람들, 자기이해와 성찰에 관심 있는 사람들"

# 카드뉴스 안에서 다룰 소재 카테고리 풀 (generate_content.py가 이 중 history.json에
# 없는 항목을 우선적으로 골라 세부 주제를 좁혀서 생성합니다)
category_pool:
  - "오늘 하루 돌아보기 (사소하지만 소중했던 순간 발견하기)"
  - "관계에서 오는 마음 (가족·친구·연인과의 감정 들여다보기)"
  - "나를 이해하기 (자신의 성향과 강점, 좋아하는 것 알아가기)"
  - "불안과 걱정 다스리기 (막연한 걱정을 다루는 마음가짐)"
  - "쉼과 회복 (지쳤을 때 나를 돌보는 방법)"
  - "작은 성취 발견하기 (스스로를 인정하고 칭찬하는 연습)"
  - "변화와 성장 (새로운 시도와 도전 앞에서의 마음)"
  - "후회와 화해 (과거의 나와 화해하는 연습)"
  - "감사와 만족 연습 (당연한 것에서 발견하는 감사)"
  - "미래에 대한 막연함 다루기 (불확실함을 대하는 태도)"
  - "습관과 루틴 (하루를 편안하게 만드는 작은 습관)"
  - "나만의 속도 인정하기 (비교에서 벗어나 나답게)"

brand:
  bg_color: "#0B0812"
  text_color: "#F5F2FB"
  primary_color: "#7FF7D0"
  accent_color: "#FF6BD6"
  gold_color: "#E7B84A"
  ink_color: "#2A2140"
  display_font: "'Gothic A1', sans-serif"
  label_font: "'Orbitron', sans-serif"
  body_font: "'Noto Sans KR', sans-serif"
  series_name: "마음 북극성"
  # "owl" 또는 "human" — 어떤 마스코트 캐릭터를 쓸지 선택
  character: "owl"

slides:
  min: 6
  max: 9

image:
  width: 1080
  height: 1350

posting:
  timezone: "Asia/Seoul"

model: "gemini-3.6-flash"

github_pages:
  base_url: "https://marketleader.github.io/instagram-cardnews-agent"

