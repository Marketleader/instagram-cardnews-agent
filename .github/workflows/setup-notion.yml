name: Setup Notion Database

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover database + extend schema
        env:
          NOTION_TOKEN: ${{ secrets.CARDNEWSAGENTNOTION }}
        run: python scripts/setup_notion_db.py

      - name: Commit config.yaml if changed
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add config.yaml
          git commit -m "chore: set Notion database_id" || echo "no changes"
          git push
