name: Fetch Instagram Insights

on:
  schedule:
    # 매일 15:00 UTC = 00:00 KST — 그날 발행된 게시물이 성과 지표가 안정화될
    # 만큼 시간이 지난 뒤 조회합니다 (fetch_insights.py의 48시간 기준과 별개로,
    # 매일 실행해 조건을 만족하는 게시물을 놓치지 않습니다).
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cardnews-fetch-insights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_insights.py

      - name: Commit updated history
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add content/history.json
          git commit -m "chore: update Instagram insights $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push

      - name: Sync performance to Notion
        env:
          NOTION_TOKEN: ${{ secrets.CARDNEWSAGENTNOTION }}
        run: python scripts/sync_notion.py sync-performance-all
