name: Generate Card News Draft

on:
  schedule:
    # 이틀에 한 번, 12:00 UTC = 21:00 KST — 초안만 생성합니다. 실제 발행은 별도로
    # "Publish Card News" 워크플로를 수동 실행해야 합니다.
    # 발행이 안정화되면 "0 12 * * *" (매일)로 바꾸세요. (*/2는 월 경계에서 이틀 연속
    # 실행될 수 있는 cron의 알려진 한계가 있으나, 초안 생성 빈도이므로 문제 없습니다.)
    - cron: "0 12 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cardnews-generate-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate content
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          path=$(python scripts/generate_content.py)
          echo "content_path=$path" >> "$GITHUB_OUTPUT"

      - name: Critical review (expert / creative director / investor)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/review_content.py "${{ steps.gen.outputs.content_path }}"

      - name: Render cards
        id: render
        run: |
          path=$(python scripts/render_cards.py "${{ steps.gen.outputs.content_path }}")
          echo "manifest_path=$path" >> "$GITHUB_OUTPUT"

      - name: Commit and push draft (images + content)
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add docs/ content/generated/ content/history.json
          git commit -m "chore: new draft card news $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push

      - name: Sync draft to Notion
        env:
          NOTION_TOKEN: ${{ secrets.CARDNEWSAGENTNOTION }}
        run: |
          python scripts/sync_notion.py create "${{ steps.gen.outputs.content_path }}" "${{ steps.render.outputs.manifest_path }}"
