name: Generate Card News Draft

on:
  schedule:
    # 매일 12:00 UTC = 21:00 KST — 초안만 생성합니다. 실제 발행은 별도로
    # "Publish Card News" 워크플로를 수동 실행해야 합니다.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cardnews-generate-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate content
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          path=$(python scripts/generate_content.py)
          echo "content_path=$path" >> "$GITHUB_OUTPUT"

      - name: Critical review (expert / creative director / investor)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/review_content.py "${{ steps.gen.outputs.content_path }}"

      - name: Render cards
        run: |
          python scripts/render_cards.py "${{ steps.gen.outputs.content_path }}"

      - name: Commit and push draft (images + content)
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add docs/ content/generated/ content/history.json
          git commit -m "chore: new draft card news $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
