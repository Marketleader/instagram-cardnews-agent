name: Publish Card News to Instagram

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "발행할 게시물의 post_id (비워두면 가장 최근 미발행 초안 사용)"
        required: false
      dry_run:
        description: "true면 실제 IG 게시 없이 URL/캡션만 출력"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: cardnews-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Resolve draft to publish
        id: resolve
        run: |
          path=$(python scripts/resolve_draft.py "${{ github.event.inputs.post_id }}")
          echo "content_path=$path" >> "$GITHUB_OUTPUT"

      - name: "Re-render cards (GitHub에서 콘텐츠 수정 시 반영을 위해 항상 재생성)"
        id: render
        run: |
          path=$(python scripts/render_cards.py "${{ steps.resolve.outputs.content_path }}")
          echo "manifest_path=$path" >> "$GITHUB_OUTPUT"

      - name: Commit and push re-rendered images
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add docs/
          git commit -m "chore: re-render before publish $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push

      - name: Wait for GitHub Pages propagation
        run: sleep 60

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/publish_instagram.py "${{ steps.render.outputs.manifest_path }}" --dry-run
          else
            python scripts/publish_instagram.py "${{ steps.render.outputs.manifest_path }}"
          fi

      - name: Mark draft as published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python scripts/mark_published.py "${{ steps.resolve.outputs.content_path }}"
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add content/history.json
          git commit -m "chore: mark $(basename ${{ steps.resolve.outputs.content_path }}) as published" || echo "no changes"
          git push
